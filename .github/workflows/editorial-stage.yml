name: Editorial source snapshot

on:
  push:
    branches: ['editorial/atlas-cubic-companion-20261008']
    paths: ['.github/workflows/editorial-stage.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked sources only (no git metadata or credentials)
        run: |
          mkdir -p /tmp/editorial-snapshot
          git archive --format=tar.gz HEAD > /tmp/editorial-snapshot/repository.tar.gz
          git rev-parse HEAD > /tmp/editorial-snapshot/COMMIT.txt
          sha256sum /tmp/editorial-snapshot/repository.tar.gz > /tmp/editorial-snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editorial-source-snapshot
          path: /tmp/editorial-snapshot/
          if-no-files-found: error
          retention-days: 1
