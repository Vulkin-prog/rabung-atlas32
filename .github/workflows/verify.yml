name: Bounded reproduction

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
      - name: Check sample data and reject damaged frames
        run: |
          python3 -B scripts/verify_atlas.py
          python3 -B -m unittest discover -s tests
      - name: Verify the fixed million ternary profiles and long-run positions
        run: python3 -B scripts/verify_ternary.py
      - name: Verify mathematical certificates
        run: |
          python3 -B reproducibility/proofs/verify_synthesis.py
          python3 -B reproducibility/proofs/verify_report4.py
          python3 -B reproducibility/anteriorities/theorie_densites_residuels_20261004/preuves/verify_results.py
      - name: Verify cubic quadruplets and ternary diagnostics
        run: python3 -B scripts/verify_editorial.py --catalogue
      - name: Verify GPU tables and the separate bounds addendum
        run: |
          mkdir -p build
          python3 -B scripts/verify_publication_references.py
          python3 -B scripts/verify_gpu_method.py
          python3 -B scripts/verify_bounds_update.py
          g++ -O3 -std=c++17 -Wall -Wextra -Wconversion -o build/independent_profile reproducibility/bounds_update/independent_profile.cpp
          python3 -B reproducibility/bounds_update/check_small.py build/independent_profile
          g++ -O3 -std=c++17 -Wall -Wextra -Wconversion -o build/two_bit_profile reproducibility/bounds_update/two_bit_profile.cpp
          python3 -B reproducibility/bounds_update/check_small.py build/two_bit_profile --max-order 3
      - name: Recompute initial primes on CPU
        run: |
          python3 -B scripts/build_workers.py
          python3 -B scripts/recompute_small.py --count 256
      - name: Regenerate local maximum counts by two exact algorithms
        run: |
          g++ -O3 -std=c++17 reproducibility/proofs/local_maximum.cpp -o build/local_maximum
          build/local_maximum reproducibility/evidence/new/local_relations_input.txt build/local_maximum.csv
          cmp build/local_maximum.csv reproducibility/evidence/new/LOCAL_MAXIMUM_CUBIC.csv
  manuscripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the manuscript toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern
      - name: Compile all four standalone manuscripts twice
        run: |
          mkdir -p build/paper
          for source in paper/PAPER_EN.tex paper/CUBIC_QUADRUPLETS_EN.tex paper/GPU_METHOD_EN.tex paper/RABUNG_BOUNDS_EN.tex; do
            for pass in 1 2; do
              pdflatex -no-shell-escape -interaction=nonstopmode -halt-on-error -output-directory=build/paper "$source"
            done
          done
          if grep -E 'Overfull|There were undefined references|Citation.*undefined' build/paper/*.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-manuscripts
          path: build/paper/*.pdf
          if-no-files-found: error
          retention-days: 14
