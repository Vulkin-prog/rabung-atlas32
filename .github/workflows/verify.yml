# Operational isolated branch; do not merge into main.
name: Isolated CPU coordinates - ternary million
on:
  push:
    branches: [research/ternary-coordinate-export-20261005]
permissions:
  contents: read
concurrency:
  group: isolated-ternary-cpu-export
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            scripts
            data/ternary-million
            research/coordinate_export
      - name: Check unchanged data and reader
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 452907920dc623d4d1e6ae7675428fe02ed840c4
          git diff --exit-code HEAD^ HEAD -- data scripts
      - name: Read retained positions and classify bounded coordinates - CPU only
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 480s python3 -B research/coordinate_export/export_classified.py --repo "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/coordinate-export" --seconds 450
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload compact text witnesses and counts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ternary-coordinate-export-${{ github.run_id }}
          path: ${{ runner.temp }}/coordinate-export/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
          overwrite: false
